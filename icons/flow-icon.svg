<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A00E0" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3A7BD5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Orqa fon yumaloq to'rtburchak (Dark theme) -->
  <rect width="256" height="256" rx="56" fill="#141722" />

  <!-- Flow "F" oqim to'lqinlari -->
  <g filter="url(#glow)">
    <!-- Asosiy vertikal oqim (F magistrali) -->
    <path d="M 68 56 C 68 49.37 73.37 44 80 44 L 100 44 C 106.63 44 112 49.37 112 56 L 112 200 C 112 206.63 106.63 212 100 212 L 80 212 C 73.37 212 68 206.63 68 200 Z" fill="url(#flowGrad1)" />

    <!-- Yuqori gorizontal oqim to'lqini -->
    <path d="M 112 56 C 135 45 165 42 192 58 C 205 66 195 86 180 86 C 158 86 135 88 112 94 Z" fill="url(#flowGrad1)" />

    <!-- O'rta gorizontal oqim to'lqini -->
    <path d="M 112 118 C 130 110 152 108 172 120 C 182 126 174 142 162 142 C 145 142 128 143 112 148 Z" fill="url(#flowGrad2)" />

    <!-- Dinamik oqim zarrachasi / tezlik nuri -->
    <circle cx="188" cy="180" r="14" fill="#00D2FF" />
    <path d="M 152 180 L 174 180" stroke="#00D2FF" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
